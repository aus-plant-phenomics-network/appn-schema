name: Deploy MkDocs to Pages

on:
  workflow_dispatch:
    inputs:
      # environment: 
        # type: environment
        # required: true
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install -r requirements.txt
      
      - name: Copy png to docs/images
        run: |
          mkdir -p docs/images
          cp -f ttl_uml/*.png docs/images/
          
          
      - name: Move ER diagram HTML to docs as index.html
        run: |
          mkdir -p docs/erdiagram
          cp -f docs/er_diagram/er_diagram_from_tab_to_schema/erdiagram/index.html docs/erdiagram/index.html
          

      - run: mkdocs build
      

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
