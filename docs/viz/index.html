network.on("doubleClick", function (params) {

  }
});

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Platform", "label": "appn:Platform", "shape": "dot", "title": "appn:Platform\n        https://schema.plantphenomics.org.au/Platform\n          A vehicle, building, person or other entity that may carry or include Sensors or Actuators.\nA Platform is also an ObservationUnit so that it may be the target for Observation Assays (reading device state as ObservedVariables) and potentially for Control Assays (setting parameters as ControlledVariables).\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Platform/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Treatment", "label": "appn:Treatment", "shape": "dot", "title": "appn:Treatment\n        https://schema.plantphenomics.org.au/Treatment\n          An Assay that adds a Substance or a SubstanceAmount to an ObservationUnit (includes potting, fertigation, pesticide application, addition of beneficials, etc.).\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Treatment/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/GrowthFacility", "label": "appn:GrowthFacility", "shape": "dot", "title": "appn:GrowthFacility\n        https://schema.plantphenomics.org.au/GrowthFacility\n          A building, enclosed space, field unit, container or other entity in which plants are grown.\nGrowthFacilities may be nested inside other GrowthFacilities, e.g. rhizoboxes inside a growth chamber, to any depth.\nGrowthFacilities include all non-biological ObservationUnits and may be defined for each spatial context at which environmental observations are collected or management actions (Treatments) are performed for one or more BiologicalUnits.\nWhere relevant, the position of a GrowthFacility within a larger GrowthFacility can be specified using a Location.\nGrowthFacilities may be Platforms for Sensors and Actuators.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_GrowthFacility/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Controller", "label": "appn:Controller", "shape": "dot", "title": "appn:Controller\n        https://schema.plantphenomics.org.au/Controller\n          The entity responsible for performing an Control action and delivering a value for a ControlledVariable.\nThe Controller may be a Person, an Actuator, a SoftwareApplication or an ExternalEvent.\nNote that SOSA maps sosa:Actuator to prov:Agent, but CDIF recommendation is that Agent should be an intentional role.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Controller/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Study", "label": "appn:Study", "shape": "dot", "title": "appn:Study\n        https://schema.plantphenomics.org.au/Study\n          A research activity including one or more Assays that record data on a set of ObservationUnits.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Study/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Observer", "label": "appn:Observer", "shape": "dot", "title": "appn:Observer\n        https://schema.plantphenomics.org.au/Observer\n          The entity responsible for performing an Observation and delivering a value for an ObservedVariable.\nThe Observer may be a Person, a Sensor or a SoftwareApplication.\nNote that SOSA maps sosa:Sensor to prov:Agent, but CDIF recommendation is that Agent should be an intentional role.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Observer/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/GrowthFacilityType", "label": "appn:GrowthFacilityType", "shape": "dot", "title": "appn:GrowthFacilityType\n        https://schema.plantphenomics.org.au/GrowthFacilityType\n          A term from an enumeration of types of GrowthFacility.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_GrowthFacilityType/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/ResearchActivity", "label": "appn:ResearchActivity", "shape": "dot", "title": "appn:ResearchActivity\n        https://schema.plantphenomics.org.au/ResearchActivity\n          A time-delimited activity contributing to a research goal.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_ResearchActivity/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Scale", "label": "appn:Scale", "shape": "dot", "title": "appn:Scale\n        https://schema.plantphenomics.org.au/Scale\n          A system of units or representation format for values associated with a Variable.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Scale/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Deployment", "label": "appn:Deployment", "shape": "dot", "title": "appn:Deployment\n        https://schema.plantphenomics.org.au/Deployment\n          A transient or long-term association between a Sensor or Actuator and a Platform on which it is mounted.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Deployment/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Role", "label": "appn:Role", "shape": "dot", "title": "appn:Role\n        https://schema.plantphenomics.org.au/Role\n          A role performed by a person in the context of a research activity\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Role/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/SpatialLocation", "label": "appn:SpatialLocation", "shape": "dot", "title": "appn:SpatialLocation\n        https://schema.plantphenomics.org.au/SpatialLocation\n          A location defined with geospatial coordinates.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_SpatialLocation/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/MaterialSource", "label": "appn:MaterialSource", "shape": "dot", "title": "appn:MaterialSource\n        https://schema.plantphenomics.org.au/MaterialSource\n          The source for the BiologicalMaterial.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_MaterialSource/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Assay", "label": "appn:Assay", "shape": "dot", "title": "appn:Assay\n        https://schema.plantphenomics.org.au/Assay\n          A research action that observes or modifies a set of ObservationUnits.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Assay/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Substance", "label": "appn:Substance", "shape": "dot", "title": "appn:Substance\n        https://schema.plantphenomics.org.au/Substance\n          A biological or chemical entity used in a Treatment assay or referenced in a SubstanceAmount.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Substance/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/ObservationUnit", "label": "appn:ObservationUnit", "shape": "dot", "title": "appn:ObservationUnit\n        https://schema.plantphenomics.org.au/ObservationUnit\n          An entity for which a Study collects data or controls the environment and other parameters.\nObservationUnits may be BiologicalUnits, Substances, Platforms (including GrowthFacilities) or devices (Sensors and Actuators).\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_ObservationUnit/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/ExternalEvent", "label": "appn:ExternalEvent", "shape": "dot", "title": "appn:ExternalEvent\n        https://schema.plantphenomics.org.au/ExternalEvent\n          A default entity to represent any trigger outside the control of the experimenters that may affect the state of the experiment and alter a Variable of interest, e.g. severe weather events or equipment failures.\nWhere possible, the resulting state of the experiment should be quantified and the ExternalEvent modeled as the Controller for a Control event.\nWhere quantification is impossible, the ExternalEvent should be modeled as the Controller for a Treatment event.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_ExternalEvent/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/XYZLocation", "label": "appn:XYZLocation", "shape": "dot", "title": "appn:XYZLocation\n        https://schema.plantphenomics.org.au/XYZLocation\n          A location defined using an appropriate local spatial geometry in three dimensions.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_XYZLocation/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/BiologicalUnit", "label": "appn:BiologicalUnit", "shape": "dot", "title": "appn:BiologicalUnit\n        https://schema.plantphenomics.org.au/BiologicalUnit\n          A plant or set of plants sharing the same BiologicalMaterial (e.g. a plot or crop in a field) or any Sample of a plant (e.g. an individual organ or leaf clipping) or set of plants (e.g. a cut from a plot) that is treated as an ObservationUnit for collecting or reporting data.\nBiologicalUnits may be part of larger BiologicalUnits.\nFor example a plant (BiologicalUnit) may be part of a cohort (BiologicalUnit) sharing the same BiologicalMaterial and Treatments.\nWhere relevant, the position of a BiologicalUnit within a larger BiologicalUnit or within a GrowthFacility can be specified using a Location.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_BiologicalUnit/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Country", "label": "appn:Country", "shape": "dot", "title": "appn:Country\n        https://schema.plantphenomics.org.au/Country\n          A country\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Country/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/BiologicalMaterial", "label": "appn:BiologicalMaterial", "shape": "dot", "title": "appn:BiologicalMaterial\n        https://schema.plantphenomics.org.au/BiologicalMaterial\n          A taxonomic and/or genetic profile for one or more BiologicalUnits.\nWhere possible, this should include the material source for the BiologicalMaterial.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_BiologicalMaterial/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/SubstanceAmount", "label": "appn:SubstanceAmount", "shape": "dot", "title": "appn:SubstanceAmount\n        https://schema.plantphenomics.org.au/SubstanceAmount\n          A Variable (representation of a quantity using a defined Scale) for a Substance applied to an ObservationUnit.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_SubstanceAmount/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/BiologicalUnitType", "label": "appn:BiologicalUnitType", "shape": "dot", "title": "appn:BiologicalUnitType\n        https://schema.plantphenomics.org.au/BiologicalUnitType\n          A term from an enumeration of types of BiologicalUnit.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_BiologicalUnitType/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Person", "label": "appn:Person", "shape": "dot", "title": "appn:Person\n        https://schema.plantphenomics.org.au/Person\n          A Person, preferably identified using an ORCID, that may perform an Assay.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Person/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/SensorType", "label": "appn:SensorType", "shape": "dot", "title": "appn:SensorType\n        https://schema.plantphenomics.org.au/SensorType\n          A term from an enumeration of types of Sensor.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_SensorType/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/Trait", "label": "appn:Trait", "shape": "dot", "title": "appn:Trait\n        https://schema.plantphenomics.org.au/Trait\n          A concept represented by a Variable associated with an ObservationUnit.\nIn the DDI-CDI Variable Cascade, a Trait is a Concept or ConceptualVariable.\n        ", "url": "https://aus-plant-phenomics-network.github.io/appn-schema/appn_Trait/"}, {"color": "#5E81AC", "font": {"face": "Inter", "size": 18}, "id": "https://schema.plantphenomics.org.au/ControlledVariable", "label": "appn:ControlledVariable", "shape": "dot", "title": "appn:ControlledVariable\n        https://schema.plantphenomics.org.au/ControlledVariable\n                           // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        
// Open node.url in a new tab when a node is clicked
network.on("doubleClick", function (params) {
  if (params.nodes && params.nodes.length > 0) {
    var nodeId = params.nodes[0];
    try {
      var node = nodes.get(nodeId);
      if (node && node.url) {
        window.open(node.url, "_blank", "noopener,noreferrer");
      }
    } catch (e) {
      console.error("Could not open node URL:", e);
    }
  }
});
